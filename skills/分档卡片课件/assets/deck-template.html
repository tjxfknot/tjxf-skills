<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分档卡片课件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1220; --bg2:#121a2b; --grid:rgba(255,255,255,.045);
  --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.2);
  --fg:#eef2f8; --dim:#a3b1c6; --mute:#7a8aa3;
  --t1:#e8b84b; --t2:#4fb6d9; --t3:#5fbf8f; --t4:#f08b4c; --t5:#a98ce0; --t6:#e2739a;
  --good:#4ecb8d; --bad:#f2696b; --shadow:0 6px 22px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#f2efe8; --bg2:#fbf9f5; --grid:rgba(30,28,24,.05);
  --panel:rgba(255,255,255,.9); --line:rgba(30,28,24,.16); --line2:rgba(30,28,24,.3);
  --fg:#23262c; --dim:#5b5f68; --mute:#8a8e97;
  --t1:#b8862b; --t2:#1f7fa6; --t3:#2f8a5f; --t4:#c1622a; --t5:#6f4fa8; --t6:#b03a68;
  --good:#2f8a5f; --bad:#c0392f; --shadow:0 4px 16px rgba(40,35,25,.14);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ============ 画布 ============ */
#canvas{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background:
    radial-gradient(1200px 800px at 20% 0%, color-mix(in srgb,var(--t2) 8%,transparent), transparent 60%),
    radial-gradient(1000px 700px at 90% 100%, color-mix(in srgb,var(--t4) 7%,transparent), transparent 60%),
    var(--bg)}
#canvas.grabbing{cursor:grabbing}
#dots{position:absolute;inset:-4000px;background-image:radial-gradient(var(--grid) 1.4px, transparent 1.4px);
  background-size:34px 34px;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#links path{fill:none;stroke-linecap:round}

/* ============ 节点 ============ */
/* 字号基准：这套图是电视上的讲课课件，摄像机拍下来还要能看清，所有字号按「一屏一张卡」来定 */
.node{position:absolute;left:0;top:0;border-radius:16px;background:var(--panel);
  font-size:calc(16px * var(--fs,1));
  border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 22px;
  transition:transform .5s cubic-bezier(.22,.68,.28,1), border-color .18s, box-shadow .18s;
  backdrop-filter:blur(3px);user-select:none}
.node:hover{border-color:var(--c,var(--line2))}
.node.hit{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent),var(--shadow)}
.node .bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:3px;background:var(--c)}
.node.clickable{cursor:pointer}

/* 三种卡片同一个尺寸（880×660，4:3）：标题卡、梯队卡、院校卡都要能单独占一屏讲 */
.node.root, .node.tier, .node.school.open{min-height:660px}
.node.root{display:flex;align-items:center;justify-content:center;padding:40px 48px;text-align:center}
.node.root .t{font-size:4.75em;font-weight:800;letter-spacing:.02em;line-height:1.15}
.node.root .s{display:none}          /* 开场只留大标题，介绍词靠口播 */

.node.tier{display:flex;flex-direction:column;justify-content:center;padding:34px 40px}
.node.tier .kx{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.node.tier .no{font-size:1.25em;font-weight:800;letter-spacing:.14em;color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 14%,transparent);padding:.28em .7em;border-radius:8px}
.node.tier .cnt{font-size:1.25em;color:var(--mute)}
.node.tier .t{font-size:3.5em;font-weight:800;line-height:1.2}
.node.tier .p{font-size:2.125em;color:var(--c);font-weight:700;margin-top:22px;line-height:1.35}
.node.tier .hintline{font-size:1em;color:var(--mute);margin-top:26px}
.node.tier .r{font-size:1.625em;color:var(--dim);margin-top:26px;line-height:1.55;
  border-top:1px dashed var(--line);padding-top:22px}

.node.school{width:var(--cw,680px)}   /* 折叠卡也要装得下「中国科学技术大学 + 40~50%」一整排 */
/* 展开后一张卡就是一屏讲解画面：固定 4:3 横板，内容块竖向均分撑满 */
.node.school.open{--cw:880px;display:flex;flex-direction:column}
.node.school.open .pill{display:none}   /* 地域下面那栏已经写了，标题排不重复 */
/* 校名 + 地域 + 保研/升学 同排，数字靠右对齐 */
.node.school .hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.node.school .t{font-size:1.875em;font-weight:800;line-height:1.2}
.node.school.open .t{font-size:2.875em}
.pill{font-size:1.0625em;padding:.22em .7em;border-radius:8px;background:color-mix(in srgb,var(--fg) 7%,transparent);
  color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);
  background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);
  background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.top{color:var(--t1);border-color:color-mix(in srgb,var(--t1) 40%,transparent);
  background:color-mix(in srgb,var(--t1) 13%,transparent)}
.node.school .nums{display:flex;gap:22px;align-items:baseline;margin-left:auto}
.node.school .nums div{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.node.school .nums b{font-size:1.75em;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.node.school .nums span{font-size:1em;color:var(--mute)}
.node.school.open .nums b{font-size:2.625em}
.node.school.open .nums span{font-size:1.25em}
/* 展开即时生效：布局测量要拿到真实高度，不能等动画 */
.node .det{display:none}
.node.open .det{display:block;margin-top:16px;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.node .det{border-top:1px dashed var(--line);padding-top:16px}
.node.open .det{display:grid;grid-template-columns:1fr;gap:17px;align-content:start}
/* 4:3 的板子里，几块信息竖着均分，画面不塌也不挤 */
.node.school.open .det{flex:1;gap:0;align-content:space-evenly}
.node .kv .k{font-size:1.0625em;color:var(--mute);letter-spacing:.16em;margin-bottom:7px}
.node .kv .v{font-size:1.5625em;line-height:1.6;color:var(--fg)}
.node.school.open .kv .k{font-size:1.25em;margin-bottom:10px}
.node.school.open .kv .v{font-size:2em;line-height:1.5}
.node .kv .v b{color:var(--c)}
/* 专业名 / 班型名做成标签，讲的时候念名字就行 */
.tags{display:flex;flex-wrap:wrap;gap:.45em}
.tag{font-size:.95em;font-weight:700;color:var(--c);padding:.25em .62em;border-radius:.42em;
  background:color-mix(in srgb,var(--c) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
/* 原稿单独点名的（全国第一、王牌）加重，一眼看得出该重点讲哪个 */
.tag.hi{background:color-mix(in srgb,var(--c) 34%,transparent);
  border-color:color-mix(in srgb,var(--c) 75%,transparent);color:var(--fg)}
.none{color:var(--mute);font-size:.92em}
/* 编辑模式下标签底下那行源文本：用顿号分隔，改完标签跟着变 */
.src{display:none}
body.editing .src{display:block;font-size:.62em;line-height:1.5;color:var(--mute);
  margin-top:.5em;white-space:pre-wrap}
body.editing .src:empty::after{content:'（在这行写，用、分隔）';opacity:.6}
/* 原稿没写的项：留个位，讲课前用「改文字」补 */
.node .kv .v:empty::after{content:'待补';color:var(--mute);opacity:.45;font-size:.88em}
.node .more{position:absolute;right:14px;bottom:11px;font-size:.875em;color:var(--mute);
  letter-spacing:.06em;transition:.2s}
/* 折叠时展开提示跟在同一排行尾（不再另占一层高度），展开后回到右下角 */
.node.school .more{position:static;margin-left:2px;font-size:1.375em;line-height:1;color:var(--mute)}
.node.school.open .more{position:absolute;right:16px;bottom:12px;font-size:.9375em}
.node.open .more{opacity:.35}
.node .fold{position:absolute;left:8px;bottom:-16px;width:32px;height:32px;
  border-radius:50%;background:var(--bg2);border:1px solid var(--line2);color:var(--fg);
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:3;font-weight:700;transition:.16s}
.node .fold:hover{background:var(--c);color:#0d1220;border-color:transparent}

/* 校徽水印：直接拿校徽 PNG 的透明通道当蒙版，填卡片主题色 —— 天然单色化，跟着配色走 */
.node.school .logo{display:none}
body.nologo .node.school.open .logo{display:none}
.node.school.open .logo{display:block;position:absolute;left:47.8%;top:57.7%;
  width:440px;height:440px;transform:translate(-50%,-50%);
  opacity:var(--lgo,.3);pointer-events:none;z-index:0;
  background:var(--c);visibility:hidden;
  -webkit-mask-image:var(--m);mask-image:var(--m);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center}
/* 墨稿算好之前先不露脸，免得闪一下原图 */
body.inkready .node.school.open .logo{visibility:visible}
.node.school.open .hd, .node.school.open .det{position:relative;z-index:1}
/* ============ 工具栏 ============ */
#bar{position:fixed;top:16px;left:16px;right:16px;z-index:20;display:flex;gap:10px;align-items:center;
  pointer-events:none;flex-wrap:wrap}
#bar>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  backdrop-filter:blur(8px)}
#title{padding:10px 16px;display:flex;align-items:baseline;gap:10px}
#title b{font-size:18px;font-weight:800}
#title span{font-size:12px;color:var(--mute)}
#tools{display:flex;gap:2px;padding:5px}
#tools button{background:none;border:0;color:var(--fg);font:inherit;font-size:15px;padding:8px 13px;
  border-radius:8px;cursor:pointer;white-space:nowrap}
#tools button:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)}
#tools button.pri{background:var(--t3);color:#06140d;font-weight:700}
#search{display:flex;align-items:center;gap:7px;padding:0 12px}
#search input{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;padding:9px 0;
  width:130px;outline:none}
#search input::placeholder{color:var(--mute)}
#search .ico{color:var(--mute);font-size:13px}
#hits{font-size:11.5px;color:var(--mute);min-width:34px}
#legend{position:fixed;left:16px;bottom:16px;z-index:20;padding:11px 14px;display:flex;gap:14px;
  flex-wrap:wrap;max-width:calc(100vw - 32px)}
#legend div{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
#legend i{width:11px;height:11px;border-radius:3px;display:block}
#zoom{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:2px;padding:5px}
#zoom button{background:none;border:0;color:var(--fg);font:inherit;font-size:15px;width:34px;height:32px;
  border-radius:8px;cursor:pointer}
#zoom button:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)}
#zoom span{font-size:12px;color:var(--mute);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#tip{position:fixed;right:16px;top:70px;z-index:20;padding:12px 15px;font-size:12px;color:var(--dim);
  line-height:1.85;max-width:230px}
#tip b{color:var(--fg);font-weight:600}
#tip .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--mute);font-size:14px;padding:2px 5px}
#tip.hide{display:none}
/* 编辑模式 */
body.editing .node{cursor:default}
body.editing .v:has(.src){outline:none;background:none}
body.editing [data-e]{outline:1px dashed color-mix(in srgb,var(--fg) 30%,transparent);
  outline-offset:3px;border-radius:4px;cursor:text;min-width:14px;display:inline-block}
body.editing dd[data-e], body.editing .r[data-e], body.editing .p[data-e]{display:block}
body.editing [data-e]:hover{outline-color:var(--t2);background:color-mix(in srgb,var(--t2) 10%,transparent)}
body.editing [data-e]:focus{outline:2px solid var(--t2);
  background:color-mix(in srgb,var(--t2) 14%,transparent)}
/* 字号滑块：编辑模式里拖着试多大合适 */
#fsBox, #lgBox{display:flex;align-items:center;gap:9px;padding:0 12px;font-size:14px;color:var(--dim)}
#fsBox input, #lgBox input{width:120px;accent-color:var(--t3)}
#fsBox b, #lgBox b{font-size:14px;color:var(--fg);min-width:46px;font-variant-numeric:tabular-nums}
#tools button.off{color:var(--mute);text-decoration:line-through}

/* 展示墙：开头结尾的背景画面 —— 卡片铺满，中间压大标题 */
#wall, #wallmask{opacity:0;visibility:hidden;transition:opacity .5s ease, visibility .5s}
body.wall #wall, body.wall #wallmask{opacity:1;visibility:visible}
#wallmask{position:fixed;inset:0;z-index:14;pointer-events:none;
  background:radial-gradient(1600px 950px at 30% 46%, rgba(6,9,18,.92), rgba(6,9,18,.7) 40%,
             rgba(6,9,18,.42) 66%, rgba(6,9,18,.2) 100%),
             linear-gradient(0deg, rgba(6,9,18,.32), rgba(6,9,18,.32))}
#wall{position:fixed;left:7%;top:29%;z-index:15;pointer-events:none;
  text-shadow:0 6px 34px rgba(0,0,0,.75)}
#wall .w1{font-size:7vw;font-weight:800;color:#fff;letter-spacing:.02em;line-height:1.05}
#wall .w2{font-size:9.2vw;font-weight:800;letter-spacing:.02em;line-height:1.05;color:#f0c24e}
body.wall #canvas{cursor:default}
body.wall .node{cursor:default}
body.wall .node .fold, body.wall .node .more, body.wall .node .hintline{display:none}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);z-index:60;
  background:var(--fg);color:var(--bg);padding:11px 22px;border-radius:10px;font-size:14px;
  font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translateX(-50%)}

/* 导出模式：只留画布内容，用于生成 PPT/图片 */
body.shot #bar, body.shot #tip, body.shot #legend, body.shot #zoom{display:none}
body.shot #canvas{cursor:default}
body.shot .more, body.shot .fold, body.shot .hintline{display:none}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:color-mix(in srgb,var(--fg) 10%,transparent);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg)}
@media (max-width:820px){#tip,#legend{display:none}#search input{width:90px}}
/* 触摸屏（电视、平板）：控件加大，手指点得准 */
@media (pointer:coarse){
  #tools button{font-size:17px;padding:12px 16px}
  #title b{font-size:19px} #title span{font-size:14px}
  #search input{font-size:17px;padding:13px 0;width:170px}
  #zoom button{width:48px;height:44px;font-size:20px}
  #zoom span{font-size:15px;min-width:56px}
  #tip{font-size:15px;max-width:280px}
  #legend div{font-size:14px}
  .node .fold{width:44px;height:44px;font-size:20px;left:4px;bottom:-22px}
  .node .more{font-size:16px}
}
</style>
</head>
<body>

<div id="canvas">
  <div id="dots"></div>
  <div id="world">
    <svg id="links"></svg>
  </div>
</div>

<div id="bar">
  <div class="card" id="title"><b></b><span id="sub"></span></div>
  <div class="card" id="tools">
    <button id="bFit">回到总览</button>
    <button id="bExpand">全部展开</button>
    <button id="bCollapse">全部收起</button>
    <button id="bCue" title="把当前卡片摆到讲解定位">讲解定位</button>
    <button id="bWall" title="开头结尾的背景画面">展示墙</button>
    <button id="bLogo" title="卡片上的校徽水印，按 L 也行">校徽</button>
    <button id="bOrient">横向展开</button>
    <button id="bTheme">浅色</button>
    <button id="bEdit">改文字</button>
    <label id="fsBox" style="display:none">字号<input id="fs" type="range" min="0.7" max="1.6" step="0.02"><b id="fsVal">100%</b></label>
    <label id="lgBox" style="display:none">校徽<input id="lg" type="range" min="0" max="0.6" step="0.02"><b id="lgVal">30%</b></label>
    <button id="bSave" class="pri" style="display:none">导出 HTML</button>
    <button id="bReset" style="display:none">还原</button>
  </div>
  <div class="card" id="search">
    <span class="ico">⌕</span>
    <input id="q" placeholder="搜名字…" spellcheck="false">
    <span id="hits"></span>
  </div>
</div>

<div class="card" id="tip">
  <span class="x" id="tipX">×</span>
  <b>讲课快捷键</b><br>
  <kbd>↓</kbd>/<kbd>→</kbd> = 讲下一张（标题→梯队→院校依次，自动展开并归位）<br>
  <kbd>↑</kbd>/<kbd>←</kbd> = 回上一张<br>
  <kbd>1</kbd>~<kbd>6</kbd> = 跳到该梯队总览<br>
  <kbd>0</kbd> = 回到总览　<kbd>F</kbd> = 全屏<br>
  <kbd>H</kbd> = 藏起所有界面（拍摄用，再按一次回来）<br>
  <kbd>W</kbd> = 展示墙（开头结尾的背景画面）<br>
  <kbd>L</kbd> = 校徽水印开关（透明度在「改文字」里调）<br>
  <b>讲解定位</b>：卡片始终摆在画面左中，位置固定<br>
  <br>
  <b>怎么看</b><br>
  空白处拖动 = 平移　滚轮 = 平移<br>
  <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + 滚轮 = 缩放<br>
  点院校卡片 = 展开详情　点 <b>−</b> = 收起分支
</div>

<div id="wallmask"></div>
<div id="wall"><div class="w1"></div><div class="w2"></div></div>

<div class="card" id="legend"></div>
<div id="toast"></div>

<div class="card" id="zoom">
  <button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button>
  <button id="zFit" title="适应屏幕">⤢</button>
</div>

<script>
/* 必须最先执行：留存原始骨架，供「导出 HTML」重建文件 */
const SELF_SRC = document.currentScript.textContent;
const BODY_TPL = (()=>{ const c = document.body.cloneNode(true);
  c.querySelectorAll('script').forEach(n=>n.remove()); return c.innerHTML; })();

/*DATA_START*/
let DATA = {
 "ver": 1,
 "fs": 1,
 "logo": 0.3,
 "cover": {
  "title": "标题卡 换成你的标题",
  "sub": "副标题（角上小字）",
  "lead": "开场口播词，只存不显示在卡片上。"
 },
 "tiers": [
  {
   "n": 1,
   "title": "第一梯队",
   "short": "一句话定位",
   "punch": "这一档的口播金句",
   "ruler": "这一档凭什么这么分：给判断标准，两三行。",
   "items": [
    {
     "name": "条目甲",
     "note": "北京",
     "metrics": [
      {
       "v": "70%",
       "k": "指标一"
      },
      {
       "v": "79%",
       "k": "指标二"
      }
     ],
     "fields": [
      {
       "k": "标签栏",
       "v": "名词甲、<b>名词乙</b>、名词丙",
       "tag": true
      },

   onlyBold=false 用于优势专业：整串按顿号切开，<b> 标过的是最拿得出手的那个，标签加重显示 */
function tagList(text, onlyBold){
  const src = String(text || '');
  const segs = onlyBold
    ? (src.match(/<b>(.*?)<\/b>/g) || []).map(x => [x, true])
    : src.split(/[；;]/).flatMap(x => x.split(/(<b>.*?<\/b>)/)).map(x => [x, /<b>/.test(x)]);
  const out = segs.flatMap(([t, hi]) => plain(t).split(/[、，,]/).map(x => [x.trim(), hi]))
                  .filter(([x]) => x);
  if(out.length)
    return `<div class="tags">${out.map(([x, hi]) => `<span class="tag${hi ? ' hi' : ''}">${esc(x)}</span>`).join('')}</div>`;
  const t = plain(src).replace(/[。\s]+$/, '');
  return t ? `<span class="none">${esc(t)}</span>` : '';
}

/* ===== 校徽墨稿 =====
   38 个校徽底色深浅不一：白底的只有笔画是深的，深底的整块都是深的。
   直接拿原图当水印会一半看不见、一半糊成色块，所以先在 canvas 里归一化成「墨稿」——
   浅底取深色笔画，深底自动反相取亮色笔画，圆底本身丢掉，只留形状当蒙版，再填梯队色。*/
const INK = {};
function inkify(url, cb){
  const img = new Image();
  img.onload = () => {
    const w = img.width, h = img.height;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d', { willReadFrequently:true });
    cx.drawImage(img, 0, 0);
    let d; try{ d = cx.getImageData(0, 0, w, h); }catch(e){ return cb(url); }
    const p = d.data;
    let sum = 0, n = 0;
    for(let i = 0; i < p.length; i += 4){
      if(p[i+3] < 24) continue;
      sum += (p[i]*.299 + p[i+1]*.587 + p[i+2]*.114) / 255; n++;
    }
    // 深底 = 大面积不透明 + 整体偏暗。只看亮度会把「透明底 + 深色线条」也误判成深底，
    // 那样会走反相分支，笔画浓度只剩四成，水印淡到看不见
    const deep = n / (w * h) > .5 && sum / n < .5;
    for(let i = 0; i < p.length; i += 4){
      const a = p[i+3] / 255;
      const lum = (p[i]*.299 + p[i+1]*.587 + p[i+2]*.114) / 255;
      const ink = a * Math.min(1, (deep ? lum : 1 - lum) * 1.2);
      p[i] = p[i+1] = p[i+2] = 255;
      p[i+3] = Math.round(ink * 255);
    }
    cx.putImageData(d, 0, 0);
    cb(cv.toDataURL('image/png'));
  };
  img.onerror = () => cb(url);
  img.src = url;
}
function paintLogos(){
  const els = [...document.querySelectorAll('.node.school .logo')];
  let waiting = 0;
  els.forEach(el => {
    const cls = [...el.classList].find(c => /^lg-\d+$/.test(c));
    if(!cls) return;
    if(INK[cls]){ el.style.setProperty('--m', 'url(' + INK[cls] + ')'); return; }
    const m = getComputedStyle(el).getPropertyValue('--m').match(/url\(["']?(data:[^"')]+)["']?\)/);
    if(!m) return;
    INK[cls] = '';                            // 占位，避免重复算
    waiting++;
    inkify(m[1], out => {
      INK[cls] = out;
      document.querySelectorAll('.' + cls).forEach(x => x.style.setProperty('--m', 'url(' + out + ')'));
      if(--waiting === 0) document.body.classList.add('inkready');
    });
  });
  if(!waiting) document.body.classList.add('inkready');
}

/* 改完文字后只刷新卡片内容，不重建 DOM（保留 el 引用和展开状态） */

/* ================= 布局 ================= */
const COL_W = CARD_W, COL_GAP = 64, IND = 40, GAP_Y = 16, ROW_GAP = 54;   // COL_W 只是最小列宽
const GX = 100, GYH = 18, GTH = 38;   // 横向模式的间距
let ORIENT = 'v';                     // 'v' = 从上往下展开；'h' = 从左往右展开

function measure(){ nodes.forEach(n => {
  n.h = n.el.offsetHeight;
  if(n.kind === 'school') n.w = n.el.offsetWidth;
}); }

/* 从上往下：梯队横向成列，院校在列内自上而下 */
function layoutV(){
  const cols = root.children;
  let x = 0;
  const tierTop = root.h + 96;
  let firstX = 0, lastRight = 0;
  cols.forEach((tn, i) => {
    tn.x = x; tn.y = tierTop;
    let y = tierTop + tn.h + ROW_GAP;
    // 收起的档只按梯队卡占宽，总览才不会被没露面的院校卡撑得又宽又小
    let colW = Math.max(COL_W, tn.w);
    tn.children.forEach(sn => { sn.x = x + IND; sn.y = y; y += sn.h + GAP_Y;
      if(!tn.collapsed && visible(sn)) colW = Math.max(colW, IND + sn.w); });
    if(i === 0) firstX = x;
    lastRight = x + colW;
    x += colW + COL_GAP;
  });
  root.x = (firstX + lastRight) / 2 - root.w / 2;
  root.y = 0;
}

/* 从左往右：梯队纵向排列，院校继续向右；父节点竖直居中于子节点组 */
function layoutH(){
  const tierX = root.w + GX;
  let y = 0;
  root.children.forEach((tn, i) => {
    if(i) y += GTH;
    const y0 = y;
    tn.x = tierX;
    if(tn.collapsed || !tn.children.length){
      tn.y = y; y += tn.h + GYH;
    } else {
      let cy = y;
      tn.children.forEach(sn => { sn.x = tierX + tn.w + GX; sn.y = cy; cy += sn.h + GYH; });
      const last = tn.children[tn.children.length - 1];
      let ty = (tn.children[0].y + last.y + last.h) / 2 - tn.h / 2;
      if(ty < y0){ const d = y0 - ty; ty = y0; tn.children.forEach(sn => sn.y += d); cy += d; }
      tn.y = ty;
      y = Math.max(cy, tn.y + tn.h + GYH);
    }
  });
  root.x = 0;
  root.y = Math.max(0, (y - GYH) / 2 - root.h / 2);
}

/* 导出单个梯队时：院校铺成网格，充分利用 16:9 画面 */
let GRID = false;
function layoutGrid(){
  const t = root.children.find(x => !x.hidden);
  if(!t){ layoutV(); return; }
  const kids = t.children, n = kids.length;
  const cols = n <= 2 ? Math.max(n,1) : (n <= 6 ? 2 : 3);
  const CW = Math.max(560, ...kids.map(k => k.w + 26)), RG = 22;
  const rows = Math.ceil(n / cols);
  root.x = 0; root.y = 0;
  t.x = root.w + 70; t.y = 0;
  let y = Math.max(root.h, t.h) + 56;
  for(let r = 0; r < rows; r++){
    let hh = 0;
    for(let c = 0; c < cols; c++){
      const sn = kids[r*cols + c]; if(!sn) continue;
      sn.x = c * CW; sn.y = y; hh = Math.max(hh, sn.h);
    }
    y += hh + RG;
  }
}

/* 海报模式：六个梯队各成一块，3列2行铺开，全部37所在一张图里 */
let POSTER = false;
function layoutPoster(){
  const BW = 1740, GAPX = 76, GAPY = 86, COLS = 3, CW = 560, CGY = 20;
  const tiers = root.children;
  let y = root.h + 96;
  for(let br = 0; br < Math.ceil(tiers.length / COLS); br++){
    let blockH = 0;
    for(let bc = 0; bc < COLS; bc++){
      const tn = tiers[br*COLS + bc]; if(!tn) continue;
      const x = bc * (BW + GAPX);
      tn.x = x; tn.y = y;
      const kids = tn.children;
      if(!kids.length){ blockH = Math.max(blockH, tn.h); continue; }
      const gc = Math.min(3, kids.length);
      const ch = Math.max.apply(null, kids.map(k => k.h));
      const CWp = Math.max(CW, ...kids.map(k => k.w + 22));
      const ky = y + tn.h + 28;
      kids.forEach((sn, i) => {
        sn.x = x + (i % gc) * CWp;
        sn.y = ky + Math.floor(i / gc) * (ch + CGY);
      });
      const rows = Math.ceil(kids.length / gc);
      blockH = Math.max(blockH, tn.h + 28 + rows * (ch + CGY));
    }
    y += blockH + GAPY;
  }
  const totalW = COLS * BW + (COLS - 1) * GAPX;
  root.x = totalW / 2 - root.w / 2;
  root.y = 0;
}

/* 展示墙：45 张卡（标题 1 + 梯队 6 + 院校 38）刚好 9 列 5 行铺满，
   顺序打散一下，同色卡片不会挤在一块；画面按 cover 缩放，边上露出去的不用管 */
let WALL = false, wallKeep = null;
const WALL_COLS = 9, WALL_GAP = 60;
function layoutWall(){
  const n0 = nodes.length;
  nodes.forEach((n, i) => {
    const j = (i * 17) % n0;                       // 17 与 45 互质：稳定又均匀的打散
    const c = j % WALL_COLS, r = Math.floor(j / WALL_COLS);
    n.x = c * (CARD_W + WALL_GAP);
    n.y = r * (CARD_H + WALL_GAP);
  });
}
function wallSize(){
  const rows = Math.ceil(nodes.length / WALL_COLS);
  return [WALL_COLS * CARD_W + (WALL_COLS - 1) * WALL_GAP, rows * CARD_H + (rows - 1) * WALL_GAP];
}
function fitWall(){
  const [w, h] = wallSize();
  const k = Math.max(innerWidth / w, innerHeight / h) * 1.02;   // cover：宁可露出去也别留边
  view.k = k;
  view.x = (innerWidth - w * k) / 2;
  view.y = (innerHeight - h * k) / 2;
  apply();
}
function setWall(on){
  if(on === WALL) return;
  WALL = on;
  document.body.classList.toggle('wall', on);
  if(on){
    wallKeep = nodes.map(n => ({ n, open:n.open, collapsed:n.collapsed, hidden:n.hidden }));
    nodes.forEach(n => {
      n.hidden = false; n.collapsed = false;
      if(n.kind === 'school' && n.el.querySelector('.det')){ n.open = true; n.el.classList.add('open'); }
      syncTier(n);
    });
    relayout(true); glide(); fitWall();
  } else {
    (wallKeep || []).forEach(o => {                 // 退出后回到进展示墙之前的状态
      o.n.open = o.open; o.n.collapsed = o.collapsed; o.n.hidden = o.hidden;
      o.n.el.classList.toggle('open', !!o.open); syncTier(o.n);
    });
    wallKeep = null;
    rebuild(); relayout(true); glide(); fit();
  }
}

function layout(){
  if(WALL) layoutWall();
  else if(POSTER) layoutPoster();
  else if(GRID) layoutGrid();
  else ORIENT === 'h' ? layoutH() : layoutV();
  nodes.forEach(n => {
    const vis = visible(n);
    n.el.style.display = vis ? '' : 'none';
    if(vis) n.el.style.transform = `translate(${n.x}px,${n.y}px)`;
  });
}

function syncTier(n){
  if(n.kind !== 'tier') return;
  const b = n.el.querySelector('[data-fold]');
  if(b) b.textContent = n.collapsed ? '+' : '−';
  const h = n.el.querySelector('.hintline');
  if(h) h.textContent = n.collapsed
    ? `点卡片展开 ${n.data.items.length} ${UNIT}`
    : `${n.data.items.length} ${UNIT} · 点卡片收起`;
}

function visible(n){
  if(n.hidden) return false;
  let p = n.parent;
  while(p){ if(p.hidden || p.collapsed) return false; p = p.parent; }
  return true;
}

/* —— 连线：用布局坐标画，不读屏幕位置（页面刚加载时位移动画还没生效，读出来全是错的） —— */
function drawLinks(){
  const parts = [];
  if(WALL){ svg.innerHTML = ''; return; }
  nodes.forEach(n => {
    if(!n.parent || !visible(n)) return;
    const a = n.parent, b = n;
    const col = n.tier ? TC(n.tier) : 'var(--line2)';
    const w = n.kind === 'tier' ? 2.4 : 1.7;
    const op = n.kind === 'tier' ? .85 : .55;
    if((GRID || POSTER) && n.kind === 'school') return;
    if(ORIENT === 'h'){
      const x1 = a.x + a.w, y1 = a.y + a.h/2, x2 = b.x, y2 = b.y + b.h/2;
      const mx = x1 + (x2 - x1) * .5;
      parts.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
        stroke="${col}" stroke-width="${w}" opacity="${op}"/>`);
    } else if(n.kind === 'tier'){
      const x1 = a.x + a.w/2, y1 = a.y + a.h, x2 = b.x + b.w/2, y2 = b.y;
      const my = y1 + (y2 - y1) * .55;
      parts.push(`<path d="M${x1},${y1} C${x1},${my} ${x2},${y1+(y2-y1)*.45} ${x2},${y2}"
        stroke="${col}" stroke-width="${w}" opacity="${op}"/>`);
    } else {
      const tx = a.x + 17, y1 = a.y + a.h, y2 = b.y + b.h/2, x2 = b.x, R = 9;
      parts.push(`<path d="M${tx},${y1} L${tx},${y2-R} Q${tx},${y2} ${tx+R},${y2} L${x2},${y2}"
        stroke="${col}" stroke-width="${w}" opacity="${op}"/>`);
    }
  });
  svg.innerHTML = parts.join('');
  const b = bounds();
  svg.setAttribute('width', b.x + b.w + 200);
  svg.setAttribute('height', b.y + b.h + 200);
}

function bounds(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n => { if(!visible(n)) return;
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x+n.w); y1=Math.max(y1,n.y+n.h); });
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}

let animT = 0;
function relayout(animate){
  // 顺序要紧：先按折叠状态显隐，再量高度（display:none 的节点量出来是 0），最后排位置
  nodes.forEach(n => { n.el.style.display = visible(n) ? '' : 'none'; });
  measure(); layout();
  drawLinks();
}

/* ================= 视图变换 ================= */
const canvas = document.getElementById('canvas');
let view = { x:60, y:60, k:1 };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function apply(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  document.getElementById('dots').style.backgroundPosition = `${view.x}px ${view.y}px`;
  document.getElementById('dots').style.backgroundSize = `${34*view.k}px ${34*view.k}px`;
  document.getElementById('zVal').textContent = Math.round(view.k*100) + '%';
}

function fit(pad){
  pad = pad || 56;
  const b = bounds();
  const k = clamp(Math.min((innerWidth - pad*2)/b.w, (innerHeight - pad*2 - 90)/b.h), .12, 1.5);
  view.k = k;
  view.x = (innerWidth - b.w*k)/2 - b.x*k;
  view.y = (innerHeight - b.h*k)/2 - b.y*k + 20;
  apply();
}

function focus(n, k){
  const tk = k || Math.max(view.k, .75);
  view.k = tk;
  view.x = innerWidth/2 - (n.x + n.w/2)*tk;
  view.y = innerHeight/2 - (n.y + n.h/2)*tk;
  apply();
}

/* —— 拖拽平移 —— */
let drag = null;
canvas.addEventListener('pointerdown', e => {
  if(e.target.closest('.node')) return;
  drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y };
  canvas.classList.add('grabbing');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if(!drag || pinch) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  apply();
});
const endDrag = () => { drag = null; canvas.classList.remove('grabbing'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* —— 滚轮：平移；⌘/Ctrl+滚轮 或 触控板捏合：缩放 —— */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    const k0 = view.k, k1 = clamp(k0 * Math.pow(0.99, e.deltaY), .12, 3);
    view.x = e.clientX - (e.clientX - view.x) * k1/k0;
    view.y = e.clientY - (e.clientY - view.y) * k1/k0;
    view.k = k1;
  } else {
    view.x -= e.deltaX; view.y -= e.deltaY;
  }
  apply();
}, { passive:false });

/* —— 触屏：单指拖动由 pointer 事件负责；双指捏合缩放 —— */
let pinch = null;
const dist2 = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a, b] = e.touches;
    pinch = { d: dist2(a, b), cx: (a.clientX + b.clientX)/2, cy: (a.clientY + b.clientY)/2,
              k: view.k, x: view.x, y: view.y };
    drag = null; canvas.classList.remove('grabbing');
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a, b] = e.touches;
    const k1 = clamp(pinch.k * (dist2(a, b) / pinch.d), .12, 3);
    const cx = (a.clientX + b.clientX)/2, cy = (a.clientY + b.clientY)/2;
    // 以两指中点为锚：既缩放也跟着手指平移
    view.k = k1;
    view.x = cx - (pinch.cx - pinch.x) * (k1 / pinch.k);
    view.y = cy - (pinch.cy - pinch.y) * (k1 / pinch.k);
    apply();
  }
}, { passive:false });

const endPinch = e => { if(!e.touches || e.touches.length < 2) pinch = null; };
canvas.addEventListener('touchend', endPinch);
canvas.addEventListener('touchcancel', endPinch);

function zoomBy(f){
  const k0 = view.k, k1 = clamp(k0*f, .12, 3);
  const cx = innerWidth/2, cy = innerHeight/2;
  view.x = cx - (cx - view.x) * k1/k0;
  view.y = cy - (cy - view.y) * k1/k0;
  view.k = k1; apply();
}

/* ================= 讲解定位 ================= */
/* 讲课时卡片始终落在画面这块区域（相对屏幕的比例）：左上角对齐 x/y，缩放按 w/h 兜住
   —— 主播站右侧，卡片摆左中，位置固定不跳，摄像机构图才稳 */
const CUE = { x:.09, y:.15, w:.48, h:.62 };
let CURRENT = null;                 // 当前正在讲的节点（院校卡或梯队总览卡）
let PENDING = false;                // 搜出来但还没讲的那所：下一次按 ↓ 先讲它本身，别跳过去
let NAV = 0;                        // 视图操作序号：讲解定位一旦发生，之前排队的自动缩放就作废
let glideT;
function glide(){
  world.style.transition = 'transform .5s cubic-bezier(.22,.68,.28,1)';
  clearTimeout(glideT);
  glideT = setTimeout(() => { world.style.transition = ''; }, 560);
}
function cueTo(n, animate){
  if(!n) return;
  NAV++;
  // 上限放到 1.8：梯队总览卡本身窄，不放大的话这一屏太空，字也白白变小
  const k = clamp(Math.min(innerWidth*CUE.w/n.w, innerHeight*CUE.h/n.h), .28, 1.8);
  view.k = k;
  view.x = innerWidth*CUE.x - n.x*k;
  view.y = innerHeight*CUE.y - n.y*k;
  if(animate !== false) glide();
  apply();
}
/* 讲解流程只往前推，不替用户收东西：展开过的一律保持展开 */
function unhideAll(){
  if(WALL) setWall(false);
  if(GRID || POSTER){ GRID = false; POSTER = false; FOCUS = 0; }
  root.children.forEach(tn => { tn.hidden = false; });
}
/* 讲解顺序就是 nodes 的天然顺序：标题卡 → 第一梯队总览 → 该档院校 → 第二梯队总览 → …
   三种卡尺寸一样，每张都能单独占一屏 */
function goTo(n){
  if(!n) return;
  unhideAll();
  if(n.kind === 'tier' && n.collapsed){ n.collapsed = false; syncTier(n); }
  if(n.kind === 'school'){
    if(n.parent.collapsed){ n.parent.collapsed = false; syncTier(n.parent); }
    if(n.el.querySelector('.det') && !n.open){
      n.open = true; n.el.classList.add('open');
      const m = n.el.querySelector('.more'); if(m) m.textContent = '收起';
    }
  }
  relayout(true);
  CURRENT = n; PENDING = false;
  cueTo(n);
}
function step(dir){
  if(dir > 0 && PENDING && CURRENT){ goTo(CURRENT); return; }   // 搜出来还没讲的，先讲它本身
  let i = CURRENT ? nodes.indexOf(CURRENT) + dir : (dir > 0 ? 0 : nodes.length - 1);
  i = clamp(i, 0, nodes.length - 1);
  goTo(nodes[i]);
}
/* 数字键 1~6：回到该梯队的总览卡，并摆到讲解定位；之后按 ↓ 从这一档第一所开始讲 */
function gotoTier(t){ goTo(root.children.find(x => x.tier === t)); }

/* ================= 交互 ================= */
/* —— 聚焦：点一个梯队就只看这一档，院校铺成方块，讲解时不用来回滚 —— */
let FOCUS = 0;
function focusTier(t){
  FOCUS = t;
  GRID = !!t;
  root.children.forEach(tn => {
    tn.hidden = t ? tn.tier !== t : false;
    tn.collapsed = t ? false : true;
    if(t && tn.tier !== t) tn.children.forEach(sn => { sn.open = false; sn.el.classList.remove('open'); });
    syncTier(tn);
  });
  relayout(true);
  setTimeout(fitFocus, 70);
}
function fitFocus(){
  const b = bounds(), pad = 64;
  const k = clamp(Math.min((innerWidth - pad*2)/b.w, (innerHeight - pad*2 - 80)/b.h), .3, 1.5);
  view.k = k;
  view.x = (innerWidth - b.w*k)/2 - b.x*k;
  view.y = (innerHeight - b.h*k)/2 - b.y*k + 24;
  apply();
}

world.addEventListener('click', e => {
  const foldBtn = e.target.closest('[data-fold]');
  const el = e.target.closest('.node');
  if(!el) return;
  const n = nodes.find(x => x.el === el);
  if(!n) return;
  if(editing) return;              // 编辑模式下点击只用于改字

  if(foldBtn || n.kind === 'tier'){
    n.collapsed = !n.collapsed;
    syncTier(n);
    CURRENT = n; PENDING = false;  // 手点过谁，键盘就从谁往下接着讲
    relayout(true);
    return;
  }
  if(n.kind === 'school'){
    if(!el.querySelector('.det')) return;
    n.open = !n.open;
    el.classList.toggle('open', n.open);
    el.querySelector('.more').textContent = n.open ? '收起' : '⌄';
    CURRENT = n; PENDING = false;
    relayout(true);
  }
});

      const m = n.el.querySelector('.more'); if(m) m.textContent = '⌄'; } });
  GRID = POSTER = false; FOCUS = 0; CURRENT = null;
  relayout(true); const my = ++NAV; setTimeout(()=>{ if(NAV === my) fit(); }, 470);
};
/* 回到总览：只把镜头拉回全景，展开过的卡片一律保持展开 */
document.getElementById('bFit').onclick = () => { unhideAll(); relayout(true); fit(); };
document.getElementById('bCue').onclick = () => cueTo(CURRENT || root);
document.getElementById('bWall').onclick = () => setWall(!WALL);
document.getElementById('zFit').onclick = () => fit();
document.getElementById('zIn').onclick = () => zoomBy(1.25);
document.getElementById('zOut').onclick = () => zoomBy(0.8);

/* ================= 改文字 & 导出 ================= */
const getP = p => p.split('/').reduce((o,k)=>o[k], DATA);
function setP(p, v){ const ks = p.split('/'), last = ks.pop();
  ks.reduce((o,k)=>o[k], DATA)[last] = v; }
function cleanHTML(h){
  return h.replace(/<div><br><\/div>/gi,'<br>').replace(/<\/div>/gi,'').replace(/<div>/gi,'<br>')
    .replace(/<br\s*\/?>/gi,'<br>').replace(/<(?!\/?(b|br|em)\b)[^>]*>/gi,'')
    .replace(/&nbsp;/g,' ').replace(/\u00a0/g,' ').trim();
}
function persist(){ try{ DATA.ver = DATA_VER; localStorage.setItem(LS, JSON.stringify(DATA)); }catch(e){} }

let toastT;
function toast(msg){ const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600); }

function setEditing(v){
  editing = v;
  const keep = FOCUS;              // 单档聚焦状态下改字，改完还回到这一档
  document.body.classList.toggle('editing', v);
  document.getElementById('bEdit').textContent = v ? '退出编辑' : '改文字';
  document.getElementById('fsBox').style.display = v ? 'flex' : 'none';
  document.getElementById('lgBox').style.display = v ? 'flex' : 'none';
  document.getElementById('bSave').style.display = v ? '' : 'none';
  document.getElementById('bReset').style.display = v ? '' : 'none';
  rebuild();                     // 刷新以便空字段也能编辑
  document.querySelectorAll('[data-e]').forEach(n => {
    if(v){ n.setAttribute('contenteditable','true'); n.spellcheck = false; }
    else n.removeAttribute('contenteditable');
  });
  if(keep) focusTier(keep); else relayout(true);
  toast(v ? '点任意文字直接改，改完按「导出 HTML」' : '已退出编辑');
}

document.addEventListener('focusout', e => {
  const n = e.target;
  if(!editing || !n.dataset || !n.dataset.e) return;
  const val = cleanHTML(n.innerHTML);
  if(val === String(getP(n.dataset.e) ?? '')) return;
  setP(n.dataset.e, val);
  persist();
  rebuild();
  relayout(true);
});

function download(name, text){
  const b = new Blob([text], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function exportHTML(){
  const dataStr = 'let DATA = ' + JSON.stringify(DATA, null, 1) + ';';
  let js = SELF_SRC.replace(/\/\*DATA_START\*\/[\s\S]*?\/\*DATA_END\*\//,
    '/*DATA_START*/\n' + dataStr + '\n/*DATA_END*/');
  js = js.replace(/<\/script/gi, '<\\/script');
  const th = document.documentElement.dataset.theme || 'dark';
  const file = '<!DOCTYPE html>\n<html lang="zh-CN" data-theme="' + th + '">\n<head>\n'
    + document.head.innerHTML + '\n</head>\n<body>\n' + BODY_TPL
    + '\n<script>\n' + js + '\n<\/script>\n</body>\n</html>';
  download(DECK + '.html', file);
  toast('已导出，用它覆盖原文件即可');
}

/* 字号无极调节：拖着看多大合适，松手就定下来，导出时一起带走 */
const fsIn = document.getElementById('fs'), fsVal = document.getElementById('fsVal');
fsIn.value = DATA.fs;
fsVal.textContent = Math.round(DATA.fs * 100) + '%';
fsIn.addEventListener('input', () => {

/* 校徽水印：按钮一键开关，编辑模式里还能拖透明度 */

  rebuild(); relayout(true);

/* —— 搜索 —— */
const q = document.getElementById('q'), hits = document.getElementById('hits');
let found = [], fi = 0;
function runSearch(){
  const s = q.value.trim();
  nodes.forEach(n => n.el.classList.remove('hit'));
  if(!s){ hits.textContent = ''; found = []; return; }
  found = nodes.filter(n => n.kind === 'school' &&
    (plain(n.data.name) + (n.data.note || '')).includes(s));
  hits.textContent = found.length ? `${fi+1}/${found.length}` : '无';
  if(!found.length) return;
  fi = fi % found.length;
  found.forEach(n => { if(n.parent.collapsed){ n.parent.collapsed = false; syncTier(n.parent); } });
  relayout(true);
  // 搜到的这所直接进讲解流程：摆到讲解定位，之后按 ↓ 从它往下接着讲
  const n = found[fi];
  n.el.classList.add('hit');
  CURRENT = n; PENDING = true;
  setTimeout(() => cueTo(n), 380);
}
q.addEventListener('input', () => { fi = 0; runSearch(); });
q.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ fi = (fi + 1) % Math.max(1, found.length); runSearch(); }
});

/* —— 键盘 —— */
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
  // 讲课主键：↓/→/空格 讲下一所，↑/← 回上一所（翻页笔发的也是这几个键）
  if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); step(1); return; }
  if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); step(-1); return; }
  if(/^[1-6]$/.test(e.key)){ gotoTier(+e.key); return; }
  if(e.key === '0'){ unhideAll(); relayout(true); fit(); CURRENT = null; }
  else if(e.key === '=' || e.key === '+'){ zoomBy(1.25); }
  else if(e.key === '-' || e.key === '_'){ zoomBy(0.8); }
  else if(e.key === 'l' || e.key === 'L'){ document.getElementById('bLogo').click(); }  // 校徽水印开关
  else if(e.key === 'w' || e.key === 'W'){ setWall(!WALL); }                           // 开头结尾的背景画面
  else if(e.key === 'Escape' && WALL){ setWall(false); }
  else if(e.key === 'h' || e.key === 'H'){ document.body.classList.toggle('shot'); }   // 拍摄时藏掉所有界面
  else if(e.key === 'e' || e.key === 'E'){ setEditing(!editing); }
  else if(e.key === 'f' || e.key === 'F'){
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});
addEventListener('resize', () => { drawLinks(); if(WALL) fitWall(); });

/* —— 图例 —— */
document.getElementById('legend').innerHTML =
  DATA.tiers.map(t => `<div><i style="background:${TC(t.n)}"></i>${esc(t.title)} · ${esc(t.short)}</div>`).join('');

/* —— 导出模式（生成 PPT/图片用）：?shot=overview|all|t1..t6 &theme=light &orient=h —— */
function qv(k){ const m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : null; }

const SHOT = qv('shot');
if(SHOT){
  document.body.classList.add('shot');
  const th = qv('theme'); if(th) document.documentElement.dataset.theme = th;
  const or = qv('orient'); if(or) ORIENT = or;
  if(SHOT === 'poster'){
    root.children.forEach(tn => { tn.collapsed = false; });
    POSTER = true;
  } else if(SHOT === 'all'){
    nodes.forEach(n => { n.collapsed = false;
      if(n.kind === 'school'){ n.open = true; n.el.classList.add('open'); } });
  } else if(/^t[1-6]$/.test(SHOT)){
    const t = +SHOT.slice(1);
    root.children.forEach(tn => { tn.hidden = tn.tier !== t; tn.collapsed = false; });
    GRID = true;
    // 院校少的梯队（如清北）直接把详情摊开，否则导出图上看不到内容
    const only = root.children.find(tn => tn.tier === t);
    if(only && only.children.length <= 3)
      only.children.forEach(sn => { sn.open = true; sn.el.classList.add('open'); });
  }
}

/* —— 启动 —— */
paintLogos();
relayout(false);
if(SHOT){
  // 导出时要装得下整张图，不受最小缩放限制
  const b = bounds(), pad = 70;
  view.k = Math.min((innerWidth - pad*2)/b.w, (innerHeight - pad*2)/b.h, 1.4);
  view.x = (innerWidth - b.w*view.k)/2 - b.x*view.k;
  view.y = (innerHeight - b.h*view.k)/2 - b.y*view.k;
  apply();
} else fit();
if(SHOT){ const bb = bounds(); document.body.setAttribute('data-bounds', Math.round(bb.w)+'x'+Math.round(bb.h)); }
</script>
</body>
